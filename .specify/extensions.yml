installed:
- git
settings:
  auto_execute_hooks: true
# Only branch creation is wired: the extension's other hooks (repository initialization, auto-commits)
# are left out on purpose. `specify extension update git` re-adds them: remove them again.
hooks:
  before_specify:
  - extension: git
    command: speckit.git.feature
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.git.feature?
    description: Create feature branch before specification
    condition: null
