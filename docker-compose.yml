# Infra locale : `pnpm dev:setup`. Ports publiés configurables dans .env (POSTGRES_PORT, etc.) :
# docker compose lit .env automatiquement.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      retries: 10

  # Files BullMQ (événements d'intégration).
  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'

  # Faux serveur SMTP : les emails envoyés s'affichent sur http://localhost:8025 (MAILPIT_UI_PORT).
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  postgres-data:
