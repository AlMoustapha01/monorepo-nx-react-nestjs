# Infra locale : `pnpm dev:setup`. Ports publiés configurables dans .env (POSTGRES_PORT, etc.) :
# docker compose lit .env automatiquement.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      retries: 10

  # Files BullMQ (événements d'intégration).
  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'

  # Faux serveur SMTP : les emails envoyés s'affichent sur http://localhost:8025 (MAILPIT_UI_PORT).
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

  # Traces et métriques (Grafana + Tempo + Prometheus), optionnel : image lourde (~900 Mo).
  #   docker compose --profile observability up -d, puis OTEL_EXPORTER_OTLP_ENDPOINT dans .env.
  # Grafana : http://localhost:3001 (OBSERVABILITY_UI_PORT), menu Explore → Tempo.
  observability:
    image: grafana/otel-lgtm:0.37.0
    profiles: [observability]
    ports:
      - '${OTLP_PORT:-4318}:4318'
      - '${OBSERVABILITY_UI_PORT:-3001}:3000'

volumes:
  postgres-data:
