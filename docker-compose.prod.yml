# Topologie de production, à lancer en local pour la vérifier (ce n'est pas un déploiement) :
#   BETTER_AUTH_SECRET=$(openssl rand -hex 32) docker compose -f docker-compose.prod.yml up --build
# Deux images : l'API (api, worker, migrate) et le service d'identité (auth, auth-migrate).
# Ordre : Postgres prêt → migrations (une fois chacune) → auth, api et worker.
name: nx-react-nestjs-prod

x-auth-contract: &auth-contract
  AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://auth.local}
  AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-api}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}

x-api-env: &api-env
  <<: *auth-contract
  NODE_ENV: production
  DATABASE_URL: postgres://app:app@postgres:5432/app
  REDIS_URL: redis://redis:6379
  SMTP_URL: smtp://mailpit:1025
  # L'API vérifie les tokens avec les clés publiques du service d'identité, par le réseau interne.
  AUTH_JWKS_URL: http://auth:3100/api/auth/jwks
  # Vide : OpenTelemetry inactif. Sinon l'URL OTLP/HTTP du collecteur (ex. http://otel-collector:4318).
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}

services:
  migrate:
    build: .
    image: nx-react-nestjs-api
    command: ['node', 'migrate.js']
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: nx-react-nestjs-api
    # Construite par le service migrate : rien à télécharger.
    pull_policy: never
    environment:
      <<: *api-env
      # Les jobs tournent dans le worker : l'API se met à l'échelle selon le trafic HTTP.
      JOBS_ENABLED: 'false'
      OTEL_SERVICE_NAME: api
      # /ready passe en 503 au SIGTERM ; le load balancer a 5 s pour retirer l'instance.
      SHUTDOWN_DRAIN_MS: '5000'
    ports:
      - '${API_PORT:-3000}:3000'
    # Au-delà du drain et de la fermeture (SHUTDOWN_TIMEOUT_MS), Docker envoie SIGKILL.
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      retries: 3
      start_period: 10s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  worker:
    image: nx-react-nestjs-api
    # Construite par le service migrate : rien à télécharger.
    pull_policy: never
    command: ['node', 'worker.js']
    environment:
      <<: *api-env
      OTEL_SERVICE_NAME: api-worker
    stop_grace_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  auth-migrate:
    build: { context: ., args: { APP: auth } }
    image: nx-react-nestjs-auth
    command: ['node', 'migrate.js']
    environment: &auth-env
      <<: *auth-contract
      NODE_ENV: production
      DATABASE_URL: postgres://app:app@postgres:5432/app
      SMTP_URL: smtp://mailpit:1025
      # URL vue par le navigateur : liens des emails, cookies.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3100}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET est requis (32 caractères minimum)}
      AUTH_APP_URL: ${AUTH_APP_URL:-http://localhost:4200}
    depends_on:
      postgres: { condition: service_healthy }

  auth:
    image: nx-react-nestjs-auth
    # Construite par le service auth-migrate : rien à télécharger.
    pull_policy: never
    environment: *auth-env
    ports:
      - '${AUTH_PORT:-3100}:3100'
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      retries: 3
      start_period: 10s
    depends_on:
      auth-migrate: { condition: service_completed_successfully }

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # BullMQ : une éviction ferait perdre des jobs.
    command: ['redis-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'yes']

  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  postgres-data:
