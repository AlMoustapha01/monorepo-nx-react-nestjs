name: Audit des dépendances

# Une faille publiée aujourd'hui touche du code qui n'a pas changé : en plus des PR qui modifient
# les dépendances, l'audit tourne chaque jour sur main (un échec notifie les mainteneurs).
on:
  pull_request:
    paths: [package.json, pnpm-lock.yaml, pnpm-workspace.yaml, .pnpmfile.cjs]
  push:
    branches: [main]
    paths: [package.json, pnpm-lock.yaml, pnpm-workspace.yaml, .pnpmfile.cjs]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version de pnpm lue dans package.json (packageManager). L'audit lit le lockfile : pas d'install.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Ce qui part en production : toute faille connue bloque.
      - name: Dépendances de production
        run: pnpm audit --prod --audit-level=moderate

      # Outils de dev et de build : failles hautes et critiques. Une faille sans correctif s'ignore
      # dans pnpm-workspace.yaml (auditConfig.ignoreGhsas), avec sa justification.
      - name: Toutes les dépendances
        run: pnpm audit --audit-level=high
