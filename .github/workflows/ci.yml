name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un nouveau push sur une PR annule la vérification précédente, devenue inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # nx-set-shas lit les runs précédents pour trouver le dernier commit vert de main.
  actions: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Actions épinglées par SHA : un tag peut être déplacé, un commit non.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nx affected compare avec la base : il faut l'historique.
          fetch-depth: 0
          persist-credentials: false

      # Version de pnpm lue dans package.json (packageManager).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Format
        run: pnpm format:check

      # Les tests d'intégration et e2e démarrent Postgres, Redis et Mailpit via Testcontainers
      # (Docker est disponible sur les runners Ubuntu).
      - name: Lint, types, tests, build (projets affectés)
        run: pnpm nx affected -t lint typecheck test build i18n-check size --parallel=3

      - name: Scripts de dev
        run: pnpm typecheck:tools && pnpm test:tools

      # Échoue si un scénario d'une spec Implemented ou Shipped n'a pas de test, ou si un test
      # cite un scénario absent ou retiré. Avertit (sans échouer) quand des tests qui citent
      # une feature changent sans son spec.md. NX_BASE vient de nx-set-shas.
      - name: Specs à jour
        run: pnpm -s spec:trace --base "$NX_BASE"

      - name: Code mort et dépendances inutilisées
        run: pnpm knip

  # Parcours navigateur (Playwright) contre la vraie stack : Postgres, Redis et Mailpit
  # (Testcontainers), service d'auth, API, front construit. Seulement si l'un d'eux a changé.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Projets e2e affectés
        id: affected
        run: echo "projects=$(pnpm -s nx show projects --affected --with-target e2e --json)" >> "$GITHUB_OUTPUT"

      - name: Navigateur
        if: steps.affected.outputs.projects != '[]'
        run: pnpm exec playwright install --with-deps chromium

      - name: Parcours e2e
        if: steps.affected.outputs.projects != '[]'
        run: pnpm nx affected -t e2e

      # Rapport HTML, traces et captures des tests en échec, journaux des services.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright
          path: dist/.playwright/apps/web-e2e
          retention-days: 7

  # Les images de production se construisent : Dockerfile, build webpack et dépendances runtime.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image de l'API
        run: docker build --tag api:ci .

      - name: Image du service d'auth
        run: docker build --build-arg APP=auth --tag auth:ci .
