# Boilerplate preset for Spec Kit. This directory is the source of truth: edit it here, then
# reinstall with `uvx --from specify-cli==1.2.2 specify preset update boilerplate --dev tools/spec-kit/preset`.
# Never edit the installed copy in .specify/presets/boilerplate/ or .claude/skills/speckit-*/.
schema_version: '1.0'

preset:
  id: 'boilerplate'
  name: 'Nx NestJS React boilerplate'
  version: '1.0.0'
  description: 'Templates and test-first commands for the Nx NestJS React boilerplate'
  author: 'nx-react-nestjs boilerplate'
  repository: 'https://github.com/AlMoustapha01/monorepo-nx-react-nestjs'
  license: 'MIT'

requires:
  speckit_version: '>=1.2.2'

provides:
  templates:
    - type: 'template'
      name: 'spec-template'
      file: 'templates/spec-template.md'
      description: 'Spec template: every acceptance scenario must be testable'
      replaces: 'spec-template'

    - type: 'template'
      name: 'plan-template'
      file: 'templates/plan-template.md'
      description: 'Plan template: boilerplate stack, domains, flag, events, migrations, access rules, test strategy'
      replaces: 'plan-template'

    - type: 'template'
      name: 'tasks-template'
      file: 'templates/tasks-template.md'
      description: 'Tasks template: mandatory tests, red-green-refactor, one user story per pull request'
      replaces: 'tasks-template'

    - type: 'template'
      name: 'prd-template'
      file: 'templates/prd-template.md'
      description: 'Product requirements document: vision, users, scope, constraints, requirements (ids of specs/product.yml)'

    - type: 'command'
      name: 'speckit.prd'
      file: 'commands/speckit.prd.md'
      description: 'Write or revise the product requirements document and the requirements of the product index, with the product reviewer'

    - type: 'template'
      name: 'design-template'
      file: 'templates/design-template.md'
      description: 'Product design: users and contexts, UX principles, voice, accessibility, visual direction, theme'

    - type: 'command'
      name: 'speckit.design'
      file: 'commands/speckit.design.md'
      description: 'Set the design direction of the product and apply it to the theme, with the designer and the design reviewer'

    - type: 'command'
      name: 'speckit.epics'
      file: 'commands/speckit.epics.md'
      description: 'Group the requirements into ordered epics with their end-to-end journeys, with the product reviewer'

    - type: 'command'
      name: 'speckit.specify'
      file: 'commands/speckit.specify.md'
      description: 'Feature branch from the git extension, reused as the spec directory; product requirements from the index'
      strategy: 'append'

    - type: 'template'
      name: 'journeys-template'
      file: 'templates/journeys-template.md'
      description: 'User journeys of a feature, screen by screen, before its mockup'

    - type: 'command'
      name: 'speckit.prototype'
      file: 'commands/speckit.prototype.md'
      description: 'Optional: user journeys then a clickable HTML mockup of a feature, with the designer and the design reviewer'

    - type: 'command'
      name: 'speckit.plan'
      file: 'commands/speckit.plan.md'
      description: 'Decisions left to the user, example code, research from the repo, appended to plan'
      strategy: 'append'

    - type: 'command'
      name: 'speckit.tasks'
      file: 'commands/speckit.tasks.md'
      description: 'Mandatory, test-first task generation appended to tasks'
      strategy: 'append'

    - type: 'command'
      name: 'speckit.analyze'
      file: 'commands/speckit.analyze.md'
      description: 'Design documents, code and dependencies, scenario coverage and approved deviations, appended to analyze'
      strategy: 'append'

    - type: 'command'
      name: 'speckit.implement'
      file: 'commands/speckit.implement.md'
      description: 'Test-first rules appended to implement'
      strategy: 'append'

    - type: 'command'
      name: 'speckit.converge'
      file: 'commands/speckit.converge.md'
      description: 'Acceptance-scenario test coverage and independent review appended to converge'
      strategy: 'append'

tags:
  - 'tdd'
  - 'nx'
  - 'nestjs'
  - 'react'
